# =======================================================
#   ESP32 Project Template — заглушка конфига
# =======================================================
# Замени name, friendly_name и содержимое под свой проект.

substitutions:
  name: esp32-project
  friendly_name: "ESP32 Project"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  variant: esp32c6
  board: esp32-c6-devkitc-1
  flash_size: 4MB
  framework:
    type: esp-idf

logger:
  level: DEBUG

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret fallback_password

captive_portal:

