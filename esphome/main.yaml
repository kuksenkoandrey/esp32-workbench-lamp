# =======================================================
#   ESP32 Workbench Lamp — умная настольная рабочая лампа с лупой
#   https://github.com/kuksenkoandrey/esp32-workbench-lamp
# =======================================================

esphome:
  name: workbench-lamp
  friendly_name: "Workbench Lamp"

esp32:
  variant: esp32c3
  flash_size: 4MB
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Workbench Lamp Fallback"
    password: !secret fallback_password

captive_portal:

# ---------- ШИМ-выходы на родные транзисторы AO3400 (N-канальные) ----------
output:
  - platform: ledc
    pin: GPIO0              # Холодный канал
    id: output_cold_white
    frequency: 4000Hz
    zero_means_zero: true

  - platform: ledc
    pin: GPIO1              # Тёплый канал
    id: output_warm_white
    frequency: 4000Hz
    zero_means_zero: true

# ---------- Единый интерфейс лампы для Home Assistant ----------
light:
  - platform: cwww
    name: "Рабочая Лампа"
    id: desktop_lamp
    cold_white: output_cold_white
    warm_white: output_warm_white

    # Диапазон цветовой температуры в Кельвинах
    cold_white_color_temperature: 6500K
    warm_white_color_temperature: 2700K

    # Плавность изменения яркости и цвета
    default_transition_length: 0.5s

# ---------- Сенсорная кнопка с логикой ВКЛ/ВЫКЛ ----------
binary_sensor:
  - platform: gpio
    pin:
      number: GPIO2
      mode: INPUT_PULLDOWN
    name: "Физическая кнопка лампы"
    internal: true
    on_press:
      then:
        - if:
            condition:
              light.is_on: desktop_lamp
            then:
              # Лампа включена — выключаем
              - light.turn_off: desktop_lamp
            else:
              # Лампа выключена — включаем на 100% и 4600K
              - light.turn_on:
                  id: desktop_lamp
                  brightness: 100%
                  color_temperature: 4600K
                  color_temperature: 4600K